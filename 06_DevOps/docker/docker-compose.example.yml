# Ví dụ cấu hình docker-compose triển khai môi trường Development chuẩn
version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: project1_db
    restart: always
    environment:
      POSTGRES_DB: project1_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: StrongPassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    container_name: project1_redis
    restart: always
    ports:
      - "6379:6379"

  backend_api:
    build:
      context: ../../04_Dev/src/backend
      dockerfile: Dockerfile
    container_name: project1_backend
    restart: always
    depends_on:
      - database
      - redis_cache
    environment:
      DATABASE_URL: "postgres://postgres:StrongPassword123!@database:5432/project1_db"
      REDIS_URL: "redis://redis_cache:6379"
      APP_PORT: 8080
    ports:
      - "8080:8080"

  frontend_web:
    build:
      context: ../../04_Dev/src/frontend
      dockerfile: Dockerfile
    container_name: project1_frontend
    restart: always
    depends_on:
      - backend_api
    ports:
      - "3000:80"

volumes:
  pgdata:
