<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${item.title + ' - Chi Tiết Món Hàng'}">Chi Tiết Món Hàng</title>
</head>
<body>
<div th:fragment="content" class="py-3">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                <img th:src="${item.mainImageUrl}" class="img-fluid w-100" style="max-height: 420px; object-fit: contain; background: #f8f9fa;" alt="Ảnh món hàng">
                <div class="card-body p-3 d-flex gap-2 overflow-auto" th:if="${not #lists.isEmpty(item.imageUrls)}">
                    <img th:each="img : ${item.imageUrls}" th:src="${img}" class="img-thumbnail" style="width: 80px; height: 80px; object-fit: cover;" alt="Ảnh phụ">
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-3 p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge bg-primary" th:text="${item.categoryName}">Danh mục</span>
                    <span class="badge bg-secondary" th:text="${item.itemCondition.displayName}">USED</span>
                </div>
                <h3 class="fw-bold mb-3" th:text="${item.title}">Tên sản phẩm</h3>
                <div class="text-muted small mb-3">
                    <i class="bi bi-clock me-1"></i> Ngày đăng: <span th:text="${T(com.auction.common.util.DateTimeUtil).formatDateTime(item.createdAt)}">01/01/2026</span>
                </div>

                <div class="border-top border-bottom py-3 my-3">
                    <h6 class="fw-bold text-dark mb-2">Mô tả sản phẩm:</h6>
                    <p class="text-muted" style="white-space: pre-line;" th:text="${item.description}">Chi tiết mô tả sản phẩm ở đây...</p>
                </div>

                <div class="mt-auto d-flex gap-2">
                    <a th:href="@{/items}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Quay Lại
                    </a>
                    <a th:href="@{'/auctions/create?itemId=' + ${item.id}}" class="btn btn-warning fw-bold">
                        <i class="bi bi-hammer me-1"></i> Mở Phiên Đấu Giá
                    </a>
                    <a th:href="@{/items/new}" class="btn btn-primary fw-bold">
                        <i class="bi bi-plus-lg me-1"></i> Đăng Món Hàng Khác
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
