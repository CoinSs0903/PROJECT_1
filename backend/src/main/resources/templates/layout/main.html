<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Hệ Thống Đấu Giá Trực Tuyến</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }
        .auction-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .auction-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15) !important;
        }
        .badge-reserve-met {
            background-color: #198754;
            color: white;
        }
        .badge-reserve-not-met {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <!-- Main Container -->
    <main class="container my-4 flex-grow-1">
        <!-- Messages Fragment -->
        <div th:replace="~{layout/messages :: messages}"></div>

        <!-- Dynamic Content -->
        <div th:replace="${content}"></div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Notification Poll / WebSocket helper -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Check unread notifications if logged in
            const badge = document.getElementById('unreadNotifBadge');
            if (badge) {
                fetch('/api/notifications/unread')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.success && data.data && data.data.length > 0) {
                            badge.innerText = data.data.length;
                            badge.classList.remove('d-none');
                            const notifList = document.getElementById('notifList');
                            const noMsg = document.getElementById('noNotifMsg');
                            if (noMsg) noMsg.remove();
                            data.data.slice(0, 5).forEach(n => {
                                const li = document.createElement('li');
                                li.innerHTML = `<a class="dropdown-item py-2 border-bottom" href="${n.actionUrl || '#'}">
                                    <div class="fw-bold small text-dark">${n.title}</div>
                                    <div class="text-muted small text-truncate" style="max-width: 280px;">${n.content}</div>
                                </a>`;
                                notifList.insertBefore(li, notifList.children[1]);
                            });
                        }
                    })
                    .catch(() => {});
            }
        });
    </script>
</body>
</html>
