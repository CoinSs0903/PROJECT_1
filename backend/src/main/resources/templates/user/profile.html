<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Hồ Sơ Cá Nhân - Sàn Đấu Giá Trực Tuyến</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center py-4">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 rounded-3 mb-4">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-person-badge me-2"></i>Hồ Sơ Cá Nhân</h5>
                <span th:class="${userProfile.status.name() == 'ACTIVE' ? 'badge bg-success' : 'badge bg-danger'}"
                      th:text="${userProfile.status.name() == 'ACTIVE' ? 'Đang Hoạt Động' : 'Bị Hạn Chế'}">Active</span>
            </div>
            <div class="card-body p-4">
                <!-- Warning if strikes > 0 -->
                <div th:if="${userProfile.unpaidStrikesCount > 0}" class="alert alert-warning d-flex align-items-center mb-4">
                    <i class="bi bi-exclamation-triangle-fill fs-3 me-3 text-warning"></i>
                    <div>
                        <div class="fw-bold">Cảnh báo vi phạm bùng hàng: <span th:text="${userProfile.unpaidStrikesCount}">1</span> / 3 gậy</div>
                        <div class="small">Nếu tích lũy đủ 3 gậy không thanh toán đơn hàng đúng hạn, tài khoản của bạn sẽ bị tạm khóa quyền tham gia đấu giá 30 ngày!</div>
                    </div>
                </div>

                <form th:action="@{/profile}" th:object="${userProfile}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tên đăng nhập</label>
                            <input type="text" class="form-control bg-light" th:field="*{username}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control bg-light" th:field="*{email}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input type="text" class="form-control" th:field="*{phoneNumber}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngân hàng thụ hưởng (khi nhận tiền hàng)</label>
                            <input type="text" class="form-control" th:field="*{bankName}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số tài khoản ngân hàng</label>
                            <input type="text" class="form-control" th:field="*{bankAccountNumber}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Địa chỉ nhận hàng mặc định</label>
                            <textarea class="form-control" rows="3" th:field="*{shippingAddress}"></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary fw-bold px-4">
                            <i class="bi bi-save me-1"></i> Lưu Thay Đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
