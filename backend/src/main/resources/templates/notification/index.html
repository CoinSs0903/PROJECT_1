<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Thông Báo Của Tôi - Sàn Đấu Giá</title>
</head>
<body>
<div th:fragment="content" class="py-3">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-bell-fill text-warning me-2"></i>Tất Cả Thông Báo</h5>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                            <i class="bi bi-bell-slash fs-1 text-secondary mb-2 d-block"></i>
                            Bạn chưa có thông báo nào.
                        </div>

                        <div th:each="n : ${notifications}" 
                             th:class="${n.read ? 'list-group-item list-group-item-action py-3 px-4 bg-white' : 'list-group-item list-group-item-action py-3 px-4 bg-light'}">
                            <div class="d-flex w-100 justify-content-between align-items-center">
                                <h6 class="mb-1 fw-bold text-dark">
                                    <i class="bi bi-circle-fill text-primary me-2 small" th:if="${!n.read}"></i>
                                    <span th:text="${n.title}">Tiêu đề thông báo</span>
                                </h6>
                                <small class="text-muted" th:text="${T(com.auction.common.util.DateTimeUtil).formatDateTime(n.createdAt)}">01/01/2026</small>
                            </div>
                            <p class="mb-2 text-secondary small" th:text="${n.content}">Nội dung thông báo chi tiết...</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <a th:if="${n.actionUrl}" th:href="${n.actionUrl}" class="btn btn-outline-primary btn-sm py-0 px-2 small">
                                    Xem chi tiết <i class="bi bi-arrow-right"></i>
                                </a>
                                <button th:if="${!n.read}" class="btn btn-link btn-sm text-decoration-none p-0 text-muted ms-auto"
                                        th:onclick="'markRead(' + ${n.id} + ')'">
                                    Đánh dấu đã đọc
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
