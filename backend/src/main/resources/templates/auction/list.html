<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Danh Sách Phiên Đấu Giá - Sàn Đấu Giá</title>
</head>
<body>
<div th:fragment="content" class="py-3">
    <!-- Search & Filter Bar -->
    <div class="card border-0 shadow-sm rounded-3 p-4 mb-4 bg-white">
        <form th:action="@{/auctions}" method="get" class="row g-3">
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Từ khoá tìm kiếm</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm tên món hàng, mô tả...">
                </div>
            </div>

            <div class="col-md-3">
                <label class="form-label small fw-semibold">Danh mục sản phẩm</label>
                <select name="categoryId" class="form-select">
                    <option value="">-- Tất cả danh mục --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId != null and categoryId == cat.id}">Điện tử</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label small fw-semibold">Sắp xếp theo</label>
                <select name="sortBy" class="form-select">
                    <option value="newest" th:selected="${sortBy == 'newest'}">Mới nhất</option>
                    <option value="endingSoon" th:selected="${sortBy == 'endingSoon'}">Sắp kết thúc</option>
                    <option value="priceAsc" th:selected="${sortBy == 'priceAsc'}">Giá: Thấp đến Cao</option>
                    <option value="priceDesc" th:selected="${sortBy == 'priceDesc'}">Giá: Cao đến Thấp</option>
                </select>
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="bi bi-funnel me-1"></i> Lọc
                </button>
            </div>
        </form>
    </div>

    <!-- Auctions Grid -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-hammer text-primary me-2"></i>Các Phiên Đấu Giá Đang Hoạt Động
            <span class="badge bg-secondary fs-6 align-middle" th:text="${#lists.size(auctions)}">0</span>
        </h4>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(auctions)}" class="text-center py-5 bg-white rounded-3 shadow-sm">
        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
        <h5 class="fw-bold text-dark">Không tìm thấy phiên đấu giá nào</h5>
        <p class="text-muted small">Hiện chưa có phiên đấu giá nào phù hợp với bộ lọc của bạn.</p>
        <a th:href="@{/auctions}" class="btn btn-outline-primary btn-sm">Xem tất cả</a>
    </div>

    <!-- Grid Cards -->
    <div th:unless="${#lists.isEmpty(auctions)}" class="row g-4">
        <div class="col-md-6 col-lg-4 col-xl-3" th:each="a : ${auctions}">
            <div class="card h-100 border-0 shadow-sm auction-card overflow-hidden">
                <div class="position-relative">
                    <img th:src="${a.itemImageUrl}" class="card-img-top" style="height: 190px; object-fit: cover;" alt="Ảnh sản phẩm">
                    <span class="position-absolute top-0 start-0 m-2 badge bg-success shadow-sm">
                        <i class="bi bi-broadcast me-1"></i>ACTIVE
                    </span>
                    <span th:if="${a.buyItNowAvailable}" class="position-absolute top-0 end-0 m-2 badge bg-warning text-dark shadow-sm">
                        <i class="bi bi-lightning-charge-fill me-1"></i>Mua Ngay
                    </span>
                </div>
                <div class="card-body d-flex flex-column justify-content-between p-3">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="badge bg-secondary small" th:text="${a.categoryName}">Danh mục</span>
                            <span class="small text-muted"><i class="bi bi-hammer me-1"></i><strong th:text="${a.bidCount}">0</strong> lượt</span>
                        </div>
                        <h6 class="card-title fw-bold text-truncate mb-2" th:title="${a.itemTitle}" th:text="${a.itemTitle}">Tên sản phẩm</h6>
                        <div class="mb-2">
                            <span class="text-muted small d-block">Giá hiện tại</span>
                            <h5 class="fw-bold text-danger mb-0" th:text="${T(com.auction.common.util.MoneyUtil).formatVnd(a.currentPrice)}">100.000 ₫</h5>
                        </div>
                    </div>
                    <div class="pt-2 border-top mt-2 d-flex justify-content-between align-items-center">
                        <small class="text-muted countdown-item" th:data-endtime="${a.endTime}">
                            <i class="bi bi-clock me-1"></i><span class="timer-text">Đang tính...</span>
                        </small>
                        <a th:href="@{'/auctions/' + ${a.id}}" class="btn btn-outline-primary btn-sm fw-semibold">
                            Đấu Giá <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    function updateCountdowns() {
        const now = new Date().getTime();
        document.querySelectorAll(".countdown-item").forEach(function(el) {
            const endStr = el.getAttribute("data-endtime");
            if (!endStr) return;
            const diff = new Date(endStr).getTime() - now;
            const textEl = el.querySelector(".timer-text");
            if (diff <= 0) {
                textEl.innerText = "Hết giờ";
            } else {
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                textEl.innerText = hours + "h " + mins + "m";
            }
        });
    }
    updateCountdowns();
    setInterval(updateCountdowns, 10000);
});
</script>
</body>
</html>
