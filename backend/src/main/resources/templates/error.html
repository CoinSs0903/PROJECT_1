<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Thông Báo Lỗi</title>
</head>
<body>
<div th:fragment="content">
    <div class="sakai-panel mx-auto my-4" style="max-width: 640px;">
        <div class="sakai-panel-header">
            <h2 class="sakai-panel-title text-danger">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Thông Báo Lỗi
            </h2>
        </div>
        <div class="sakai-panel-body text-center py-4">
            <div class="display-4 text-danger mb-3"><i class="bi bi-exclamation-triangle"></i></div>
            <h4 class="fw-bold mb-2">Đã xảy ra lỗi hệ thống</h4>
            <p th:if="${errorMessage != null}" class="text-muted mb-3" style="word-break: break-word;" th:text="${errorMessage}">Nội dung lỗi chi tiết sẽ hiển thị ở đây.</p>
            <div th:if="${errorMessage == null and status != null}" class="text-muted small mb-4" style="word-break: break-word;">
                <div>Mã lỗi: <strong th:text="${status}"></strong> <span th:if="${error}" th:text="'(' + ${error} + ')'"></span></div>
                <div th:if="${path}">Đường dẫn: <code th:text="${path}"></code></div>
                <div th:if="${message != null and message != 'No message available'}" th:text="${message}"></div>
            </div>
            <a th:href="@{/}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Quay về Trang chủ
            </a>
        </div>
    </div>
</div>
</body>
</html>
