<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Đăng Ký Tài Khoản - Sàn Đấu Giá Trực Tuyến</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center py-4">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill fs-1 text-warning"></i>
                    <h3 class="fw-bold mt-2">Tạo Tài Khoản Mới</h3>
                    <p class="text-muted small">Đăng ký một lần để vừa tham gia đấu giá vừa có thể đăng bán sản phẩm</p>
                </div>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{username}" placeholder="vd: nguyenvanan" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="vd: an@gmail.com" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{fullName}" placeholder="vd: Nguyễn Văn An" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="vd: 0987654321">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tên ngân hàng</label>
                            <input type="text" class="form-control" th:field="*{bankName}" placeholder="vd: Vietcombank">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Số tài khoản ngân hàng</label>
                            <input type="text" class="form-control" th:field="*{bankAccountNumber}" placeholder="vd: 1234567890">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Địa chỉ nhận hàng (Giao hàng sau khi thắng)</label>
                            <textarea class="form-control" rows="2" th:field="*{shippingAddress}" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-warning btn-lg fw-bold">
                            <i class="bi bi-check2-circle me-1"></i> Hoàn Tất Đăng Ký
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted small">Đã có tài khoản?</span>
                    <a th:href="@{/login}" class="fw-bold text-decoration-none">Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
