spring.application.name=auction-test

# Jackson / Timezone
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Datasource Configuration for auction_test
spring.datasource.url=jdbc:mysql://localhost:3306/auction_test?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=auction
spring.datasource.password=auction
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.fail-on-missing-locations=false
spring.flyway.locations=classpath:db/migration
