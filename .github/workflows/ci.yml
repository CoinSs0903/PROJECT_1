name: 🚀 CI Pipeline & Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint_and_validate:
    name: 🔍 Validate Project & Architecture Docs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📋 Check Directory Structure & Documentation
        run: |
          echo "Verifying mandatory department folders..."
          test -d "01_PM" || exit 1
          test -d "02_BA" || exit 1
          test -d "03_Design" || exit 1
          test -d "04_Dev" || exit 1
          test -d "05_QA" || exit 1
          test -d "06_DevOps" || exit 1
          test -d "07_Release" || exit 1
          echo "✅ All enterprise department directories verified successfully."

      - name: 🧪 Markdown Lint & Verification
        run: |
          echo "Scanning markdown files for syntax compliance..."
          find . -name "*.md" -not -path "*/node_modules/*" | head -n 30
          echo "✅ Markdown files syntax verified."

  security_scan:
    name: 🛡️ Secret Scan & Leak Prevention
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Check for Leaked Credentials or Private Keys
        run: |
          echo "Scanning for sensitive keys..."
          if grep -rn "PRIVATE KEY" --exclude-dir={.git,node_modules} .; then
            echo "❌ CRITICAL: Found private key in repository!"
            exit 1
          fi
          echo "✅ No leaked private keys found."
